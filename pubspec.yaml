name: just_autostart
description: >-
  Launch a Dart CLI or daemon at login on Windows and macOS. Pure Dart, with no
  Flutter dependency and no native sources to compile.
version: 0.1.0
homepage: https://github.com/kihyun1998/just_autostart
repository: https://github.com/kihyun1998/just_autostart
issue_tracker: https://github.com/kihyun1998/just_autostart/issues

environment:
  sdk: ^3.11.5

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
dependencies:
  # The allocator and UTF-16 marshalling `dart:ffi` does not ship. Pure Dart,
  # maintained by the Dart team, and the only runtime dependency — deliberately
  # not `package:win32`, which would pull in thousands of generated bindings to
  # call six advapi32 functions.
  ffi: ^2.1.4
